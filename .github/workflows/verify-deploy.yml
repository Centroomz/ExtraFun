name: Verify Railway deploy

# Deploys are done by Railway's GitHub integration (push to main). This
# workflow does NOT deploy: it checks that production really got the new
# commit, so a paused/broken Railway no longer fails silently
# (21.10.2026: "Deploys have been paused temporarily", nobody noticed).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # /api/health returns RAILWAY_GIT_COMMIT_SHA of the running version.
      - name: Wait until production reports this commit
        run: |
          for i in $(seq 1 60); do
            out=$(curl -s -m 20 https://www.extrafun.pl/api/health || true)
            echo "[$i] $out"
            echo "$out" | grep -q "\"commit\":\"${GITHUB_SHA}\"" && { echo "Live: ${GITHUB_SHA}"; exit 0; }
            sleep 15
          done
          echo "::error::ExtraFun: production still not on ${GITHUB_SHA} after 15 min (Railway paused or build failed?)"
          exit 1

      # GitHub emails the repo owner when a run fails. Extra DM from Lui via
      # the existing monitor endpoint, skipped until MONITOR_TOKEN is set
      # (note: it lives on gay.pl, so it cannot fire if gay.pl is down).
      - name: Alert (Lui DM) on failure
        if: failure()
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: |
          [ -n "$MONITOR_TOKEN" ] || { echo "MONITOR_TOKEN not set, skipping"; exit 0; }
          curl -sS -m 20 -X POST "https://gay.pl/api/monitor/smoke-alert"             -H "x-monitor-token: $MONITOR_TOKEN"             -H "content-type: application/json"             --data "{\"text\":\"ExtraFun: deploy ${GITHUB_SHA::7} NIE wszedl na produkcje. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
