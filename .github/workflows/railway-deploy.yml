name: Verify Railway deploy

# Deploys are done by Railway's own GitHub integration (push to main).
# This workflow does NOT deploy: it only checks that production really got
# the new commit, so a paused/broken Railway no longer fails silently
# (21.10.2026: "Deploys have been paused temporarily", nobody noticed).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # /api/health returns RAILWAY_GIT_COMMIT_SHA of the running version.
      - name: Wait until production reports this commit
        run: |
          for i in $(seq 1 60); do
            out=$(curl -s -m 20 https://www.extrafun.pl/api/health || true)
            echo "[$i] $out"
            echo "$out" | grep -q "\"commit\":\"${GITHUB_SHA}\"" && { echo "Live: ${GITHUB_SHA}"; exit 0; }
            sleep 15
          done
          echo "::error::Production still not on ${GITHUB_SHA} after 15 min (Railway paused or build failed?)"
          exit 1

      # Optional Telegram alert. Skipped silently until both secrets exist
      # (GitHub itself emails the repo owner when a run fails).
      - name: Notify Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "Telegram secrets not set, skipping"; exit 0; }
          curl -sS -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=ExtraFun: deploy ${GITHUB_SHA::7} NIE wszedl na produkcje. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
